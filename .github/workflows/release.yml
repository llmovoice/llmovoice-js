name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: npm dist-tag (`next` for prereleases, `latest` for stable releases)
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: make check
      - name: Publish public workspace packages
        run: pnpm release:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm-tag }}
          RELEASE_CONFIRM: publish
